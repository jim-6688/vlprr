name: tail_limit
description: "TailLimit 车辆限号提醒 — 跨平台（Android/iOS/鸿蒙）限号提醒应用，支持手机版与车机版、限号当日强提醒。"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 中文本地化（Material/Cupertino 组件文案 + 时间选择器）
  flutter_localizations:
    sdk: flutter

  # 状态管理 / 路由（与 LiquidPlayer 技术栈一致）
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # 本地存储（drift/SQLite）
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # 网络（限行数据源）
  dio: ^5.7.0

  # 工具
  intl: ^0.20.3
  equatable: ^2.0.7

  # 自研强提醒插件（三端：Android/iOS/OHOS）
  tail_limit_alert_plugin:
    path: ./tail_limit_alert_plugin

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.1

flutter:
  uses-material-design: true

  assets:
    # 白噪音实录音（CC BY 4.0，署名见 lib/domain/entities/noise.dart 的 AudioCredit）
    # 其余音色为算法实时合成，不占用包体
    - assets/audio/
